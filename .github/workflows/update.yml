name: Planalto update

on:
  schedule:
    # Every Monday, 9h Brasília time (12h UTC).
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: planalto-update
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest and propose changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest all laws
        run: npm run ingest:all
      - name: Validate the format
        run: npm run check
      - name: Describe the changes
        id: changes
        run: npm run describe-changes
      - name: Open or update the pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update/planalto
          commit-message: ${{ steps.changes.outputs.title }}
          title: ${{ steps.changes.outputs.title }}
          body: ${{ steps.changes.outputs.body }}
          add-paths: normas
          delete-branch: true
