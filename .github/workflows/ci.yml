name: Validação

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    name: Testes, tipos e formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run check
